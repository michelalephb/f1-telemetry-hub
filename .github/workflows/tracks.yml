name: track outlines and replays

# Rebuilds the files derived from the stored traces: track outlines (landing thumbnails, maps) and
# race replays (race story). New sessions get theirs during ingest; run this after a format change.
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season (empty = current year)
        default: ""
      what:
        description: tracks, replay or both
        default: both

concurrency:
  group: tracks
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FASTF1_CACHE: .fastf1_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          SEASON="${{ inputs.season }}"; SEASON="${SEASON:-$(date -u +%Y)}"
          WHAT="${{ inputs.what }}"; WHAT="${WHAT:-both}"
          if [ "$WHAT" != replay ]; then python -m pipeline tracks --season "$SEASON"; fi
          if [ "$WHAT" != tracks ]; then python -m pipeline replay --season "$SEASON"; fi
