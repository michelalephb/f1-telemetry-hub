name: instagram

# Posts each new session to Instagram (@f1telemetryhub): a Reel, then a carousel an hour later.
# Runs after every "ingest latest" run. Posting is OFF until social_settings.enabled is true
# (Supabase) and an Instagram token exists; until then every run is a dry run whose renders are
# kept as a workflow artifact. Pushes to other branches always dry run São Paulo (round 20).
on:
  workflow_run:
    workflows: ["ingest latest"]
    types: [completed]
  schedule:
    - cron: "41 17 * * 2"     # Tuesdays: off season rewind (does nothing while the season runs)
  push:
    branches-ignore: [main]
    paths: ["pipeline/social/**", ".github/workflows/instagram.yml"]
  workflow_dispatch:
    inputs:
      mode: {description: "run or rewind", default: "run"}
      session: {description: "Session id, e.g. 2026_20_Q (empty = sessions from the last 72 h)", default: ""}
      kind: {description: "reel or carousel (empty = both)", default: ""}
      dry_run: {description: "Render only, post nothing", type: boolean, default: true}

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg and fonts (Inter, JetBrains Mono)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-jetbrains-mono || sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Post (or dry run)
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SESSION: ${{ inputs.session }}
          KIND: ${{ inputs.kind }}
          DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python -m pipeline.social run --session 2026_20_Q --dry-run
            python -m pipeline.social run --session 2026_20_R --dry-run
            exit 0
          fi
          ARGS=()
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          if [ "$EVENT" = "schedule" ] || [ "$MODE" = "rewind" ]; then
            python -m pipeline.social rewind "${ARGS[@]}"
          else
            [ -n "$SESSION" ] && ARGS+=(--session "$SESSION")
            [ -n "$KIND" ] && ARGS+=(--kind "$KIND")
            python -m pipeline.social run "${ARGS[@]}"
          fi
      - name: TEMP preview sheet in the log (review only, removed before merge)
        if: github.event_name == 'push'
        run: |
          for f in $(find ig_out -name reel.mp4); do d=$(dirname $f); for t in 4 9 14; do ffmpeg -loglevel error -y -ss $t -i $f -frames:v 1 $d/frame_$t.jpg; done; done
          python - <<'PY'
          import base64, io, glob
          from PIL import Image
          for sid in ("2026_20_Q", "2026_20_R"):
              for kind in ("carousel", "reel"):
                  files = sorted(glob.glob(f"ig_out/{sid}/session_{kind}/*.jpg"))
                  ims = [Image.open(f).convert("RGB") for f in files]
                  ims = [i.resize((330, int(i.height * 330 / i.width))) for i in ims]
                  if not ims: continue
                  S = Image.new("RGB", (340 * len(ims), max(i.height for i in ims)), "white")
                  for k, i in enumerate(ims): S.paste(i, (340 * k, 0))
                  b = io.BytesIO(); S.save(b, "JPEG", quality=72)
                  print(f"=====BEGIN {sid}_{kind} {[f.split('/')[-1] for f in files]}")
                  t = base64.b64encode(b.getvalue()).decode()
                  for j in range(0, len(t), 200): print(t[j:j+200])
                  print(f"=====END {sid}_{kind}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-renders
          path: ig_out
          retention-days: 7
          if-no-files-found: ignore
