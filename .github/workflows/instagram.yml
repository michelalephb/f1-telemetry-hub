name: instagram

# Posts each new session to Instagram (@f1telemetryhub): a Reel, then a carousel an hour later.
# Runs after every "ingest latest" run. Posting is OFF until social_settings.enabled is true
# (Supabase) and an Instagram token exists; until then every run is a dry run whose renders are
# kept as a workflow artifact. Pushes to other branches always dry run São Paulo (round 20).
on:
  workflow_run:
    workflows: ["ingest latest"]
    types: [completed]
  schedule:
    - cron: "41 17 * * 2"     # Tuesdays: off season rewind (does nothing while the season runs)
  push:
    branches-ignore: [main]
    paths: ["pipeline/social/**", ".github/workflows/instagram.yml"]
  workflow_dispatch:
    inputs:
      mode: {description: "run, rewind or preview", default: "run"}
      round: {description: "preview: round of the coming Grand Prix", default: ""}
      session: {description: "Session id, e.g. 2026_20_Q (empty = sessions from the last 72 h)", default: ""}
      kind: {description: "reel, carousel, stories or history (empty = reel and carousel)", default: ""}
      story: {description: "stories: only story number N (1 = cover), empty = all", default: ""}
      dry_run: {description: "Render only, post nothing", type: boolean, default: true}

concurrency:
  group: instagram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      UPLOADPOST_API_KEY: ${{ secrets.UPLOADPOST_API_KEY }}
      UPLOADPOST_USER: ${{ vars.UPLOADPOST_USER }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: ffmpeg and fonts (Inter, JetBrains Mono)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter fonts-jetbrains-mono || sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
      - name: Post (or dry run)
        env:
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
          SESSION: ${{ inputs.session }}
          KIND: ${{ inputs.kind }}
          DRY: ${{ inputs.dry_run }}
          ROUND: ${{ inputs.round }}
          STORY: ${{ inputs.story }}
        run: |
          if [ "$EVENT" = "push" ]; then
            python -m pipeline.social preview --season 2026 --round 21 --dry-run
            python -m pipeline.social preview --season 2026 --round 21 --dry-run --kind stories
            exit 0
          fi
          ARGS=()
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          if [ "$MODE" = "preview" ]; then
            [ -n "$KIND" ] && ARGS+=(--kind "$KIND")
            [ -n "$STORY" ] && ARGS+=(--story "$STORY")
            python -m pipeline.social preview --round "$ROUND" "${ARGS[@]}"
          elif [ "$EVENT" = "schedule" ] || [ "$MODE" = "rewind" ]; then
            python -m pipeline.social rewind "${ARGS[@]}"
          else
            [ -n "$SESSION" ] && ARGS+=(--session "$SESSION")
            [ -n "$KIND" ] && ARGS+=(--kind "$KIND")
            python -m pipeline.social run "${ARGS[@]}"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instagram-renders
          path: ig_out
          retention-days: 7
          if-no-files-found: ignore
