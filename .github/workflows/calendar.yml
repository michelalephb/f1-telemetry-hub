name: sync calendar and results

# Calendar, sessions and official classifications (race, sprint, qualifying) from Jolpica.
# Light and separate from the ingest queue, so it can run while a season load is in progress.
on:
  push:
    branches: [main]
    paths: ["pipeline/jolpica.py", "pipeline/__main__.py", ".github/workflows/calendar.yml"]
  workflow_dispatch:
    inputs:
      season:
        description: Season (empty = current year)
        default: ""

concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FASTF1_CACHE: .fastf1_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: |
          SEASON="${{ inputs.season }}"; SEASON="${SEASON:-$(date -u +%Y)}"
          python -m pipeline calendar --season "$SEASON"
