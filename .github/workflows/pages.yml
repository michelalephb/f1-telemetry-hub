name: publish site

# Builds the static site and publishes it on GitHub Pages on every push to main.
# Data loads live from Supabase in the browser, so new sessions appear without a rebuild.
# The base path comes from the Pages settings: "/f1-telemetry-hub" on github.io, "" once a
# custom domain (f1telemetryhub.com) is set, so switching domains needs no code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npx next build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Check the build points at the right base path
        run: |
          echo "base path: '${{ steps.pages.outputs.base_path }}'  site: ${{ steps.pages.outputs.base_url }}"
          grep -q 'src="${{ steps.pages.outputs.base_path }}/_next/static' out/index.html
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
