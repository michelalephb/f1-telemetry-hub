name: history database (F1DB)

# Loads the latest F1DB release (https://github.com/f1db/f1db, CC BY 4.0: all time results, standings,
# drivers, constructors, circuits) into our Supabase schema f1db. F1DB publishes a release after each
# Grand Prix; this checks twice a week and can be run by hand.
on:
  schedule:
    - cron: "41 7 * * 1,3"
  workflow_dispatch:

concurrency:
  group: f1db
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FASTF1_CACHE: .fastf1_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline f1db
