name: ingest latest

# Four tries an hour: sync calendar and results, ingest any finished session not yet on the site,
# then fail (GitHub emails the repo owner) if a session from the last 7 days is missing.
# GitHub skips or delays scheduled runs under load, so several tries an hour give many chances per session.
on:
  schedule:
    - cron: "2,17,32,47 * * * *"   # 4 tries an hour: GitHub was running only about 1 in 8 of the hourly ones (every 8 h, Nov 2026)
  workflow_dispatch:
    inputs:
      season:
        description: Season (empty = current year)
        default: ""
      max:
        description: Max sessions this run
        default: "6"
      codes:
        description: Session codes (practice FP1,FP2,FP3 off until storage is decided)
        default: "R,Q,S,SQ"

concurrency:
  group: ingest
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # keep this scheduled workflow enabled (see last step)

jobs:
  latest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      FASTF1_CACHE: .fastf1_cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .fastf1_cache
          key: fastf1-${{ github.run_id }}
          restore-keys: fastf1-
      - name: Ingest and check the site is current
        run: |
          SEASON="${{ inputs.season }}"; SEASON="${SEASON:-$(date -u +%Y)}"
          python -m pipeline latest --season "$SEASON" --max "${{ inputs.max || '6' }}" --codes "${{ inputs.codes || 'R,Q,S,SQ' }}"
      - name: Keep the schedule alive
        # GitHub disables scheduled workflows in public repos after 60 days without repository
        # activity. Re-enabling through the API is the usual way to keep it running.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/ingest.yml/enable" || true
